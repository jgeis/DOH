[pytest]
# Pytest configuration for DOH Plotly Dashboard Testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-config=.coveragerc
    --ignore=venv
    --ignore=.venv
    --ignore=data
    --ignore=jens_changes

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for components working together
    regression: Regression tests to prevent breaking changes
    slow: Tests that take a long time to run
    db: Tests that require database access
    
# Disable warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Minimum Python version
minversion = 3.8
